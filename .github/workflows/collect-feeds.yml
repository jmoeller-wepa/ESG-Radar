name: Daily data update

on:
  schedule:
    - cron: "17 5 * * 1-5"   # Monday–Friday, 05:17 UTC (every day: "17 5 * * *")
  workflow_dispatch:         # "Run workflow" button for a manual run

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}   # optional; empty = no Teams post
      DESTATIS_TOKEN: ${{ secrets.DESTATIS_TOKEN }}         # GENESIS-Online API token (Destatis indicators)
      AGSI_KEY: ${{ secrets.AGSI_KEY }}                     # free GIE AGSI+ API key (gas storage)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser==6.0.11 openpyxl==3.1.5 pypdf==5.1.0

      - name: Collect new items
        run: python scripts/collect_feeds.py

      - name: Collect consultations & regulation status
        run: python scripts/collect_regulation.py
        continue-on-error: true

      - name: Collect market indicators
        run: python scripts/collect_market.py
        continue-on-error: true   # an unreachable statistics API never blocks the news update

      - name: Collect industry statistics
        run: python scripts/collect_industry.py
        continue-on-error: true

      - name: Collect river levels & soil moisture
        run: python scripts/collect_water.py
        continue-on-error: true

      - name: Collect heat & rain at the mills (DWD)
        run: python scripts/collect_weather.py
        continue-on-error: true

      - name: Collect gas storage (AGSI+)
        run: python scripts/collect_gas.py
        continue-on-error: true

      - name: Collect pulp imports by origin (Comext)
        run: python scripts/collect_pulp_origin.py
        continue-on-error: true

      - name: Collect EU ETS emissions of peers
        run: python scripts/collect_ets.py
        continue-on-error: true   # yearly file; skipped automatically when nothing changed

      - name: Update SBTi status of peers
        run: python scripts/collect_sbti.py
        continue-on-error: true

      - name: Collect peer news
        run: python scripts/collect_peernews.py
        continue-on-error: true

      - name: Collect Fabric / Power BI roadmap
        run: python scripts/collect_fabric.py
        continue-on-error: true

      - name: Commit changes
        run: |
          git config user.name "esg-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Feed run $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Post to Teams (optional)
        if: ${{ env.TEAMS_WEBHOOK_URL != '' }}
        run: python scripts/post_teams.py
