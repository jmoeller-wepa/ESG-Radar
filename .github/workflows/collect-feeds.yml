name: Collect feeds (monthly)

on:
  schedule:
     - cron: "17 5 * * 1"   # every Monday, 05:17 UTC
  workflow_dispatch:         # "Run workflow" button for a manual run

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser==6.0.11

      - name: Collect new items
        run: python scripts/collect_feeds.py

      - name: Commit changes
        run: |
          git config user.name "esg-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Feed run $(date -u +%Y-%m-%d)"
            git push
          fi
